name: ${COMPOSE_PROJECT_NAME:-amanda-partner-hub}

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    build:
      context: ${APP_SOURCE_DIR:?APP_SOURCE_DIR is required}
      dockerfile: ../deploy/Dockerfile
      target: runtime
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      APP_RUNTIME_ENV: ${APP_RUNTIME_ENV:-production}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SB_SERVICE_ROLE_KEY: ${SB_SERVICE_ROLE_KEY:?SB_SERVICE_ROLE_KEY is required}
      MICROSOFT_INTEGRATION_MODE: ${MICROSOFT_INTEGRATION_MODE:-disabled}
      MICROSOFT_DOC_PROCESSING_MODE: ${MICROSOFT_DOC_PROCESSING_MODE:-disabled}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      MICROSOFT_TEST_ALLOWED_TENANT_ID: ${MICROSOFT_TEST_ALLOWED_TENANT_ID:-}
      MICROSOFT_TEST_ALLOWED_ORGANIZERS: ${MICROSOFT_TEST_ALLOWED_ORGANIZERS:-}
      MICROSOFT_TEST_ALLOWED_RECIPIENTS: ${MICROSOFT_TEST_ALLOWED_RECIPIENTS:-}
      MICROSOFT_DOC_PROCESSING_ALLOWED_DRIVE_ID: ${MICROSOFT_DOC_PROCESSING_ALLOWED_DRIVE_ID:-}
      MICROSOFT_DOC_PROCESSING_ALLOWED_FOLDER: ${MICROSOFT_DOC_PROCESSING_ALLOWED_FOLDER:-}
      MICROSOFT_DOC_PROCESSING_TENANT_ID: ${MICROSOFT_DOC_PROCESSING_TENANT_ID:-}
      MICROSOFT_DOC_PROCESSING_CLIENT_ID: ${MICROSOFT_DOC_PROCESSING_CLIENT_ID:-}
      MICROSOFT_DOC_PROCESSING_CLIENT_SECRET: ${MICROSOFT_DOC_PROCESSING_CLIENT_SECRET:-}
      MICROSOFT_DOC_PROCESSING_SHAREPOINT_SITE_ID: ${MICROSOFT_DOC_PROCESSING_SHAREPOINT_SITE_ID:-}
      MICROSOFT_DOC_PROCESSING_SHAREPOINT_DRIVE_ID: ${MICROSOFT_DOC_PROCESSING_SHAREPOINT_DRIVE_ID:-}
      MICROSOFT_DOC_PROCESSING_TEMP_FOLDER: ${MICROSOFT_DOC_PROCESSING_TEMP_FOLDER:-}
      CLICKSIGN_INTEGRATION_MODE: ${CLICKSIGN_INTEGRATION_MODE:-disabled}
      CLICKSIGN_AMBIENTE_ENVIO: ${CLICKSIGN_AMBIENTE_ENVIO:-}
      CLICKSIGN_API_BASE_URL: ${CLICKSIGN_API_BASE_URL:-}
      CLICKSIGN_ACCESS_TOKEN: ${CLICKSIGN_ACCESS_TOKEN:-}
      CLICKSIGN_SANDBOX_ACCESS_TOKEN: ${CLICKSIGN_SANDBOX_ACCESS_TOKEN:-}
      CLICKSIGN_SANDBOX_ALLOWED_RECIPIENTS: ${CLICKSIGN_SANDBOX_ALLOWED_RECIPIENTS:-}
      CLICKSIGN_SANDBOX_WEBHOOK_SECRET: ${CLICKSIGN_SANDBOX_WEBHOOK_SECRET:-}
      CLICKSIGN_PRODUCAO_ACCESS_TOKEN: ${CLICKSIGN_PRODUCAO_ACCESS_TOKEN:-}
      CLICKSIGN_PRODUCAO_WEBHOOK_SECRET: ${CLICKSIGN_PRODUCAO_WEBHOOK_SECRET:-}
    expose:
      - "3000"
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
